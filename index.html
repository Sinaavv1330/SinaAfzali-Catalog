<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SINA AFZALI</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#050505;
    color:#eee2bd;
    font-family:"Vazirmatn",Tahoma,sans-serif;
}

/* =========================
   HERO
========================= */

.hero{
    min-height:100vh;
    position:relative;
    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            rgba(0,0,0,.28),
            rgba(0,0,0,.72)
        ),
        url("IMG_2983.jpeg") center center / cover no-repeat;
}

/* نور طلایی */

.hero::before{
    content:"";
    position:absolute;
    width:420px;
    height:420px;

    top:-180px;
    left:50%;

    transform:translateX(-50%);

    border-radius:50%;

    background:rgba(218,178,63,.18);

    filter:blur(100px);

    animation:goldPulse 6s ease-in-out infinite;
}

@keyframes goldPulse{
    0%,100%{
        opacity:.45;
        transform:translateX(-50%) scale(1);
    }

    50%{
        opacity:.85;
        transform:translateX(-50%) scale(1.15);
    }
}

/* =========================
   HEADER
========================= */

header{
    position:absolute;

    top:0;
    right:0;
    left:0;

    height:70px;

    padding:0 22px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    z-index:10;

    background:linear-gradient(
        rgba(0,0,0,.7),
        transparent
    );
}

.brand-mini{
    direction:ltr;

    color:#e2c76d;

    font-family:Georgia,serif;

    font-size:12px;

    letter-spacing:.18em;
}

.menu-button{
    width:42px;
    height:42px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:1px solid rgba(225,195,105,.35);

    border-radius:50%;

    color:#e2c76d;

    font-size:18px;

    background:rgba(0,0,0,.2);
}

/* =========================
   MAIN
========================= */

.hero-content{
    position:relative;

    z-index:5;

    width:90%;

    max-width:500px;

    text-align:center;

    padding-top:25px;

    animation:appear 1.4s ease-out;
}

@keyframes appear{
    from{
        opacity:0;
        transform:translateY(25px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =========================
   LOGO
========================= */

.logo-box{
    width:210px;

    max-width:65vw;

    margin:0 auto 20px;
}

.logo{
    width:100%;

    display:block;

    filter:
        drop-shadow(
            0 0 18px rgba(226,194,93,.25)
        )
        drop-shadow(
            0 18px 40px rgba(0,0,0,.9)
        );
}

/* =========================
   BRAND NAME
========================= */

.brand-name{
    direction:ltr;

    font-family:Georgia,"Times New Roman",serif;

    font-size:36px;

    letter-spacing:.13em;

    padding-left:.13em;

    color:#f0d681;

    text-shadow:
        0 0 25px rgba(225,191,83,.16);
}

.year{
    direction:ltr;

    margin-top:7px;

    color:#a8873e;

    font-family:Georgia,serif;

    font-size:13px;

    letter-spacing:.5em;

    padding-left:.5em;
}

.line{
    width:170px;

    height:1px;

    margin:20px auto;

    background:linear-gradient(
        90deg,
        transparent,
        #e3c56b,
        transparent
    );
}

.description{
    color:#d1c19d;

    font-size:11px;

    font-weight:300;

    line-height:2;
}

/* =========================
   BUTTON
========================= */

.enter{
    display:flex;

    align-items:center;
    justify-content:center;

    width:210px;
    height:50px;

    margin:28px auto 0;

    border-radius:30px;

    text-decoration:none;

    color:#090806;

    font-size:11px;

    background:linear-gradient(
        120deg,
        #f4dc8b,
        #c99f3d
    );

    box-shadow:
        0 12px 35px rgba(210,170,62,.22);

    transition:.35s;
}

.enter:active{
    transform:scale(.97);
}

/* =========================
   BOTTOM
========================= */

.bottom-text{
    position:absolute;

    bottom:20px;

    left:0;
    right:0;

    text-align:center;

    color:#9d8650;

    font-size:8px;

    letter-spacing:.18em;
}

/* =========================
   DESKTOP
========================= */

@media(min-width:700px){

    .hero-content{
        max-width:650px;
    }

    .logo-box{
        width:250px;
    }

    .brand-name{
        font-size:48px;
    }

    .description{
        font-size:12px;
    }
}
</style>
</head>

<body>

<section class="hero">

    <header>

        <div class="brand-mini">
            SINA AFZALI
        </div>

        <div class="menu-button">
            ≡
        </div>

    </header>


    <main class="hero-content">

        <div class="logo-box">

            <img
                class="logo"
                src="F8F9AF2B-49DB-4EC0-BEF6-E3FF03041997.png"
                alt="SINA AFZALI"
            >

        </div>


        <div class="brand-name">
            SINA AFZALI
        </div>


        <div class="year">
            2026
        </div>


        <div class="line"></div>


        <div class="description">
            دنیای رایحه‌های خاص و انتخاب‌های متمایز
        </div>


        <a
            href="#catalog"
            class="enter"
        >
            ورود به مجموعه
        </a>

    </main>


    <div class="bottom-text">
        CRAFTED FOR DISTINCTION
    </div>

</section>


<section
    id="catalog"
    style="
        min-height:100vh;
        background:#050505;
        display:flex;
        align-items:center;
        justify-content:center;
        text-align:center;
        padding:40px;
    "
>

    <div>

        <div
            style="
                color:#d6b65c;
                font-size:11px;
                letter-spacing:.2em;
                direction:ltr;
            "
        >
            SINAAFZALI
        </div>

        <h2
            style="
                margin-top:15px;
                color:#eee2bd;
                font-weight:400;
            "
        >
            مجموعه عطرها
        </h2>

        <p
            style="
                margin-top:12px;
                color:#817862;
                font-size:11px;
            "
        >
            کاتالوگ محصولات به‌زودی
        </p>

    </div>

</section>

</body>
</html>
