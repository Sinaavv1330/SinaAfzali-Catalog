<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SINA AFZALI | 2026</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600&display=swap');

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#020202;
  color:#eee0b4;
  font-family:"Vazirmatn",Tahoma,sans-serif;
  overflow-x:hidden;
}

/* ===== BACKGROUND ===== */

.hero{
  min-height:100vh;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;

  background:
    radial-gradient(
      ellipse at 50% 18%,
      rgba(201,164,63,.22),
      transparent 28%
    ),
    radial-gradient(
      ellipse at 50% 70%,
      rgba(166,123,31,.09),
      transparent 42%
    ),
    linear-gradient(
      180deg,
      #090909 0%,
      #030303 55%,
      #010101 100%
    );
}

/* رگه های سنگ */
.hero::before{
  content:"";
  position:absolute;
  inset:-20%;

  opacity:.25;

  background:
    linear-gradient(
      115deg,
      transparent 38%,
      rgba(255,255,255,.07) 39%,
      transparent 40%
    ),
    linear-gradient(
      70deg,
      transparent 52%,
      rgba(212,175,55,.08) 53%,
      transparent 54%
    ),
    linear-gradient(
      130deg,
      transparent 65%,
      rgba(255,255,255,.04) 66%,
      transparent 67%
    );

  transform:rotate(-4deg) scale(1.2);
}

/* نور بالایی */
.gold-light{
  position:absolute;

  width:700px;
  height:700px;

  top:-500px;
  left:50%;

  transform:translateX(-50%);

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(245,215,119,.22),
      rgba(212,175,55,.08) 30%,
      transparent 70%
    );

  filter:blur(35px);

  animation:lightPulse 6s ease-in-out infinite;
}

@keyframes lightPulse{

  0%,100%{
    opacity:.65;
    transform:translateX(-50%) scale(1);
  }

  50%{
    opacity:1;
    transform:translateX(-50%) scale(1.12);
  }
}

/* ===== HEADER ===== */

header{
  position:absolute;

  top:0;
  left:0;
  right:0;

  height:86px;

  padding:0 6%;

  display:flex;
  align-items:center;
  justify-content:space-between;

  z-index:10;

  border-bottom:1px solid rgba(212,175,55,.12);

  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.65),
      transparent
    );
}

.logo-mini{
  direction:ltr;

  font-family:Georgia,serif;

  color:#d9b957;

  font-size:15px;

  letter-spacing:.28em;
}

nav{
  display:flex;
  gap:32px;
}

nav a{
  color:#aaa18c;

  text-decoration:none;

  font-size:11px;

  transition:.3s;
}

nav a:hover{
  color:#e7cb72;
}

.instagram{
  color:#d7b85d;

  text-decoration:none;

  font-size:10px;

  border:1px solid rgba(212,175,55,.25);

  padding:8px 14px;

  border-radius:30px;

  transition:.3s;
}

.instagram:hover{
  background:rgba(212,175,55,.08);
}

/* ===== HERO CONTENT ===== */

.hero-content{
  position:relative;

  z-index:3;

  width:min(900px,92vw);

  text-align:center;

  padding-top:45px;

  animation:heroIn 1.5s cubic-bezier(.16,1,.3,1);
}

@keyframes heroIn{

  from{
    opacity:0;
    transform:translateY(35px) scale(.97);
    filter:blur(12px);
  }

  to{
    opacity:1;
    transform:none;
    filter:none;
  }
}

/* ===== LOGO ===== */

.logo-wrap{
  position:relative;

  width:min(330px,72vw);

  margin:auto;
}

.logo-wrap::after{
  content:"";

  position:absolute;

  left:10%;
  right:10%;
  bottom:0;

  height:45px;

  background:rgba(212,175,55,.2);

  filter:blur(35px);

  z-index:-1;
}

.logo{
  width:100%;

  display:block;

  object-fit:contain;

  filter:
    drop-shadow(0 0 15px rgba(212,175,55,.18))
    drop-shadow(0 25px 60px rgba(0,0,0,.9));

  animation:logoFloat 5s ease-in-out infinite;
}

@keyframes logoFloat{

  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-7px);
  }
}

/* ===== BRAND ===== */

.brand{
  direction:ltr;

  margin-top:18px;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:clamp(34px,6vw,60px);

  letter-spacing:.18em;

  padding-left:.18em;

  color:#efd47c;

  text-shadow:
    0 0 20px rgba(212,175,55,.14);
}

.year{
  direction:ltr;

  margin-top:7px;

  font-family:Georgia,serif;

  font-size:17px;

  letter-spacing:.6em;

  padding-left:.6em;

  color:#9f7d2d;
}

/* ===== LINE ===== */

.line{
  width:min(430px,65vw);

  height:1px;

  margin:22px auto;

  background:
    linear-gradient(
      90deg,
      transparent,
      #80601b,
      #f0d37b,
      #80601b,
      transparent
    );
}

/* ===== TAGLINE ===== */

.tagline{
  color:#c1ae79;

  font-size:12px;

  font-weight:300;

  letter-spacing:.04em;
}

/* ===== CTA ===== */

.cta{
  display:inline-flex;

  align-items:center;
  justify-content:center;

  margin-top:30px;

  min-width:210px;

  height:52px;

  padding:0 28px;

  border-radius:50px;

  text-decoration:none;

  color:#090806;

  font-size:12px;

  font-weight:500;

  background:
    linear-gradient(
      120deg,
      #f4db86,
      #d0a83e,
      #8d681d
    );

  box-shadow:
    0 10px 40px rgba(212,175,55,.14),
    inset 0 1px rgba(255,255,255,.5);

  transition:
    transform .35s,
    box-shadow .35s;
}

.cta:hover{
  transform:translateY(-5px);

  box-shadow:
    0 18px 50px rgba(212,175,55,.25);
}

/* ===== SCROLL ===== */

.scroll{
  position:absolute;

  bottom:25px;

  left:50%;

  transform:translateX(-50%);

  color:#75643b;

  font-size:9px;

  letter-spacing:.25em;

  opacity:.65;

  animation:scrollPulse 2.5s infinite;
}

.scroll::after{
  content:"";

  display:block;

  width:1px;

  height:28px;

  margin:8px auto 0;

  background:
    linear-gradient(
      #b99842,
      transparent
    );
}

@keyframes scrollPulse{

  0%,100%{
    opacity:.35;
  }

  50%{
    opacity:.9;
  }
}

/* ===== MOBILE ===== */

@media(max-width:700px){

  header{
    height:70px;
    padding:0 18px;
  }

  nav{
    display:none;
  }

  .instagram{
    font-size:8px;
    padding:7px 10px;
  }

  .logo-mini{
    font-size:11px;
  }

  .hero-content{
    padding-top:20px;
  }

  .logo-wrap{
    width:min(280px,75vw);
  }

  .brand{
    font-size:31px;
  }

  .year{
    font-size:15px;
  }

  .tagline{
    font-size:10px;
  }

  .cta{
    min-width:190px;
  }
}
</style>
</head>

<body>

<section class="hero">

  <div class="gold-light"></div>

  <header>

    <div class="logo-mini">
      SINA AFZALI
    </div>

    <nav>
      <a href="#">خانه</a>
      <a href="#catalog">کاتالوگ</a>
      <a href="#about">درباره ما</a>
      <a href="#contact">تماس با ما</a>
    </nav>

    <a
      class="instagram"
      href="https://instagram.com/Afzali_shopp"
      target="_blank"
    >
      اینستاگرام
    </a>

  </header>


  <div class="hero-content">

    <div class="logo-wrap">

      <img
        class="logo"
        src="F8F9AF2B-49DB-4EC0-BEF6-E3FF03041997.png"
        alt="لوگوی سینا افضلی"
      >

    </div>

    <div class="brand">
      SINA AFZALI
    </div>

    <div class="year">
      2026
    </div>

    <div class="line"></div>

    <div class="tagline">
      دنیای رایحه‌های خاص
    </div>

    <a
      href="#catalog"
      class="cta"
    >
      مشاهده کاتالوگ
    </a>

  </div>


  <div class="scroll">
    کشف کنید
  </div>

</section>


<section
  id="catalog"
  style="
    min-height:60vh;
    background:#050505;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:80px 20px;
  "
>

  <div>

    <div
      style="
        color:#b89435;
        font-size:11px;
        margin-bottom:15px;
      "
    >
      کاتالوگ SINAAFZALI
    </div>

    <h2
      style="
        color:#ead7a1;
        font-weight:400;
        font-size:30px;
      "
    >
      مجموعه عطرها
    </h2>

    <p
      style="
        color:#77705f;
        margin-top:15px;
        font-size:12px;
      "
    >
      به‌زودی مجموعه کامل عطرهای سینا افضلی
      در این بخش قرار می‌گیرد.
    </p>

  </div>

</section>

</body>
</html>
