<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SINA AFZALI | 2026</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#050505;
    color:#eee0b5;
    font-family:"Vazirmatn",Tahoma,sans-serif;
}

/* =========================
   HERO
========================= */

.hero{
    min-height:100vh;
    position:relative;
    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            rgba(0,0,0,.30),
            rgba(0,0,0,.62)
        ),
        url("IMG_2983.jpeg") center center / cover no-repeat;
}

/* لایه سینمایی */
.hero::after{
    content:"";
    position:absolute;
    inset:0;

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(225,190,85,.14),
            transparent 32%
        ),
        linear-gradient(
            180deg,
            rgba(0,0,0,.25),
            transparent 45%,
            rgba(0,0,0,.55)
        );

    pointer-events:none;
}

/* نور طلایی متحرک */
.gold-light{
    position:absolute;
    width:500px;
    height:500px;
    top:-300px;
    left:50%;

    transform:translateX(-50%);

    border-radius:50%;

    background:rgba(218,179,65,.22);

    filter:blur(100px);

    animation:pulse 6s ease-in-out infinite;
}

@keyframes pulse{
    0%,100%{
        opacity:.55;
        transform:translateX(-50%) scale(1);
    }

    50%{
        opacity:1;
        transform:translateX(-50%) scale(1.2);
    }
}

/* =========================
   HEADER
========================= */

header{
    position:absolute;
    top:0;
    right:0;
    left:0;

    height:82px;

    padding:0 6%;

    display:flex;
    align-items:center;
    justify-content:space-between;

    z-index:10;

    background:linear-gradient(
        180deg,
        rgba(0,0,0,.72),
        transparent
    );

    border-bottom:1px solid rgba(220,180,65,.12);
}

.header-name{
    direction:ltr;

    color:#dfbd5d;

    font-family:Georgia,serif;

    letter-spacing:.22em;

    font-size:15px;
}

nav{
    display:flex;
    gap:32px;
}

nav a{
    color:#ddd1af;
    text-decoration:none;
    font-size:11px;

    transition:.3s;
}

nav a:hover{
    color:#f0cf6d;
}

.instagram{
    color:#e0c46b;
    text-decoration:none;

    border:1px solid rgba(220,180,65,.3);

    border-radius:30px;

    padding:8px 16px;

    font-size:10px;

    transition:.3s;
}

.instagram:hover{
    background:rgba(220,180,65,.1);
}

/* =========================
   CONTENT
========================= */

.hero-content{
    position:relative;
    z-index:5;

    text-align:center;

    width:min(850px,92%);

    padding-top:40px;

    animation:entrance 1.5s ease-out;
}

@keyframes entrance{
    from{
        opacity:0;
        transform:translateY(35px);
        filter:blur(10px);
    }

    to{
        opacity:1;
        transform:none;
        filter:none;
    }
}

/* =========================
   LOGO
========================= */

.logo-container{
    width:min(310px,72vw);

    margin:auto;

    position:relative;
}

.logo-container::after{
    content:"";

    position:absolute;

    left:10%;
    right:10%;
    bottom:0;

    height:45px;

    background:rgba(218,179,65,.28);

    filter:blur(35px);

    z-index:-1;
}

.logo{
    width:100%;

    display:block;

    filter:
        drop-shadow(
            0 0 18px rgba(218,179,65,.2)
        )
        drop-shadow(
            0 25px 50px rgba(0,0,0,.9)
        );

    animation:logoFloat 5s ease-in-out infinite;
}

@keyframes logoFloat{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-7px);
    }
}

/* =========================
   BRAND
========================= */

.brand{
    direction:ltr;

    margin-top:18px;

    color:#f0d37b;

    font-family:Georgia,"Times New Roman",serif;

    font-size:clamp(36px,6vw,62px);

    letter-spacing:.18em;

    padding-left:.18em;

    text-shadow:
        0 0 30px rgba(218,179,65,.18);
}

.year{
    direction:ltr;

    margin-top:8px;

    color:#aa8735;

    font-family:Georgia,serif;

    font-size:17px;

    letter-spacing:.55em;

    padding-left:.55em;
}

.gold-line{
    width:min(430px,65vw);

    height:1px;

    margin:23px auto;

    background:
        linear-gradient(
            90deg,
            transparent,
            #80601c,
            #f1d67d,
            #80601c,
            transparent
        );
}

.slogan{
    color:#d0bd8b;

    font-size:12px;

    font-weight:300;
}

/* =========================
   BUTTON
========================= */

.enter-button{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    margin-top:30px;

    min-width:210px;
    height:52px;

    border-radius:50px;

    text-decoration:none;

    color:#090806;

    font-size:12px;

    background:
        linear-gradient(
            120deg,
            #f5dc88,
            #d0a83d,
            #8b671d
        );

    box-shadow:
        0 12px 40px rgba(214,175,60,.2),
        inset 0 1px rgba(255,255,255,.5);

    transition:.35s;
}

.enter-button:hover{
    transform:translateY(-5px);

    box-shadow:
        0 20px 55px rgba(214,175,60,.3);
}

/* =========================
   SCROLL
========================= */

.scroll{
    position:absolute;

    bottom:25px;
    left:50%;

    transform:translateX(-50%);

    color:#aa8d4a;

    font-size:9px;

    letter-spacing:.2em;

    z-index:5;

    animation:scroll 2.5s infinite;
}

.scroll::after{
    content:"";

    display:block;

    width:1px;
    height:28px;

    margin:8px auto;

    background:
        linear-gradient(
            #d3ad4d,
            transparent
        );
}

@keyframes scroll{
    0%,100%{opacity:.35;}
    50%{opacity:1;}
}

/* =========================
   CATALOG
========================= */

.catalog{
    min-height:70vh;

    background:
        radial-gradient(
            circle at 50% 0,
            rgba(200,160,50,.08),
            transparent 35%
        ),
        #050505;

    padding:100px 20px;

    text-align:center;
}

.catalog-small{
    color:#b99339;
    font-size:11px;
    margin-bottom:15px;
}

.catalog h2{
    color:#ead7a2;

    font-size:32px;

    font-weight:400;
}

.catalog p{
    color:#756d5b;

    font-size:12px;

    margin-top:15px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    header{
        height:70px;
        padding:0 18px;
    }

    nav{
        display:none;
    }

    .header-name{
        font-size:11px;
    }

    .instagram{
        font-size:8px;
        padding:7px 11px;
    }

    .logo-container{
        width:min(280px,76vw);
    }

    .brand{
        font-size:31px;
        letter-spacing:.12em;
        padding-left:.12em;
    }

    .year{
        font-size:14px;
    }

    .slogan{
        font-size:10px;
    }

    .enter-button{
        min-width:190px;
    }
}
</style>
</head>

<body>

<section class="hero">

    <div class="gold-light"></div>

    <header>

        <div class="header-name">
            SINA AFZALI
        </div>

        <nav>
            <a href="#">خانه</a>
            <a href="#catalog">کاتالوگ</a>
            <a href="#about">درباره ما</a>
            <a href="#contact">تماس با ما</a>
        </nav>

        <a
            class="instagram"
            href="https://instagram.com/Afzali_shopp"
            target="_blank"
        >
            اینستاگرام
        </a>

    </header>


    <div class="hero-content">

        <div class="logo-container">

            <img
                class="logo"
                src="F8F9AF2B-49DB-4EC0-BEF6-E3FF03041997.png"
                alt="SINA AFZALI"
            >

        </div>


        <div class="brand">
            SINA AFZALI
        </div>


        <div class="year">
            2026
        </div>


        <div class="gold-line"></div>


        <div class="slogan">
            دنیای رایحه‌های خاص
        </div>


        <a
            class="enter-button"
            href="#catalog"
        >
            مشاهده کاتالوگ
        </a>

    </div>


    <div class="scroll">
        کشف کنید
    </div>

</section>


<section
    class="catalog"
    id="catalog"
>

    <div class="catalog-small">
        SINAAFZALI
    </div>

    <h2>
        مجموعه عطرها
    </h2>

    <p>
        مجموعه اختصاصی عطرهای سینا افضلی
        به‌زودی در این بخش قرار می‌گیرد.
    </p>

</section>

</body>
</html>
