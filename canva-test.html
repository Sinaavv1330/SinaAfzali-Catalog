<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#030303" />
<meta name="description" content="SINA AFZALI — Signature of Scent" />
<title>SINA AFZALI — Signature of Scent</title>

<style>
  :root{
    --bg:#030303;
    --bg2:#090909;
    --gold:#d4af37;
    --gold2:#f6e2a0;
    --gold3:#8c6a1a;
    --text:#f7f1e7;
    --muted:#a9a29a;
    --line:rgba(212,175,55,.18);
    --glass:rgba(255,255,255,.04);
    --glass2:rgba(255,255,255,.02);
  }

  *{
    box-sizing:border-box;
    margin:0;
    padding:0;
  }

  html,body{
    width:100%;
    min-height:100%;
    overflow-x:hidden;
    background:
      radial-gradient(circle at 50% 0%, rgba(212,175,55,.10), transparent 28%),
      radial-gradient(circle at 0% 35%, rgba(212,175,55,.06), transparent 22%),
      radial-gradient(circle at 100% 70%, rgba(212,175,55,.05), transparent 24%),
      linear-gradient(180deg, #050505 0%, #020202 100%);
    color:var(--text);
    font-family:Tahoma, Arial, sans-serif;
  }

  body{
    position:relative;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  /* =========================
     ATMOSPHERIC BACKGROUND
  ========================= */

  .vignette{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-6;
    background:
      radial-gradient(circle at 50% 42%, transparent 0%, rgba(0,0,0,.12) 48%, rgba(0,0,0,.58) 100%);
  }

  .ambient{
    position:fixed;
    width:520px;
    height:520px;
    border-radius:50%;
    filter:blur(120px);
    pointer-events:none;
    z-index:-5;
    opacity:.8;
    animation: drift 13s ease-in-out infinite alternate;
  }

  .ambient.one{
    top:-220px;
    right:-220px;
    background:rgba(212,175,55,.09);
  }

  .ambient.two{
    bottom:-240px;
    left:-240px;
    background:rgba(212,175,55,.05);
    animation-delay:3s;
  }

  @keyframes drift{
    from{
      transform:translate3d(0,0,0) scale(1);
    }
    to{
      transform:translate3d(60px,42px,0) scale(1.16);
    }
  }

  /* =========================
     MOVING LIGHTS UP/DOWN
  ========================= */

  .light-column{
    position:fixed;
    top:-15%;
    bottom:-15%;
    width:180px;
    pointer-events:none;
    z-index:-4;
    filter:blur(18px);
    opacity:.75;
  }

  .light-column.left{
    left:-40px;
  }

  .light-column.right{
    right:-40px;
  }

  .light-beam{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    width:92px;
    height:180px;
    border-radius:999px;
    background:
      linear-gradient(180deg,
        rgba(255,237,177,0) 0%,
        rgba(255,227,150,.18) 20%,
        rgba(212,175,55,.45) 50%,
        rgba(255,227,150,.18) 80%,
        rgba(255,237,177,0) 100%);
    box-shadow:
      0 0 40px rgba(212,175,55,.22),
      0 0 90px rgba(212,175,55,.10);
    animation: floatLight 8.5s ease-in-out infinite;
  }

  .light-beam.b1{ top:10%; animation-delay:0s; }
  .light-beam.b2{ top:42%; animation-delay:1.8s; width:72px; height:150px; opacity:.82; }
  .light-beam.b3{ top:74%; animation-delay:3.6s; width:82px; height:165px; opacity:.72; }

  @keyframes floatLight{
    0%,100%{
      transform:translateX(-50%) translateY(-10px) scale(.98);
      opacity:.62;
    }
    50%{
      transform:translateX(-50%) translateY(26px) scale(1.08);
      opacity:1;
    }
  }

  /* =========================
     GOLD DUST PARTICLES
  ========================= */

  .particles{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-3;
    overflow:hidden;
  }

  .particle{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:var(--gold);
    opacity:0;
    box-shadow:0 0 10px rgba(212,175,55,.9);
    animation: rise linear infinite;
  }

  @keyframes rise{
    0%{
      transform:translateY(110vh) scale(.7);
      opacity:0;
    }
    12%{ opacity:.45; }
    50%{ opacity:.28; }
    100%{
      transform:translateY(-12vh) scale(1);
      opacity:0;
    }
  }

  /* =========================
     MAIN LAYOUT
  ========================= */

  .shell{
    min-height:100svh;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:
      max(18px, env(safe-area-inset-top))
      16px
      max(18px, env(safe-area-inset-bottom));
    position:relative;
  }

  /* =========================
     TOP BRAND
  ========================= */

  .top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    z-index:2;
    padding-top:4px;
  }

  .brand{
    display:flex;
    flex-direction:column;
    gap:4px;
  }

  .brand .name{
    color:var(--gold2);
    font-size:13px;
    letter-spacing:.32em;
    font-weight:700;
    text-transform:uppercase;
    direction:ltr;
  }

  .brand .tag{
    color:#878075;
    font-size:9px;
    letter-spacing:.26em;
    text-transform:uppercase;
    direction:ltr;
  }

  .tiny-mark{
    width:42px;
    height:42px;
    border-radius:14px;
    border:1px solid rgba(212,175,55,.18);
    background:
      linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.015));
    backdrop-filter:blur(14px);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.06),
      0 12px 24px rgba(0,0,0,.34);
    display:grid;
    place-items:center;
    color:var(--gold2);
    font-size:16px;
  }

  /* =========================
     HERO
  ========================= */

  .hero{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    position:relative;
    z-index:2;
    padding:16px 0 18px;
  }

  .hero-inner{
    width:100%;
    max-width:430px;
    animation: heroIn 1.15s cubic-bezier(.2,.8,.2,1) both;
  }

  @keyframes heroIn{
    from{
      opacity:0;
      transform:translateY(30px) scale(.98);
      filter:blur(8px);
    }
    to{
      opacity:1;
      transform:none;
      filter:blur(0);
    }
  }

  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    color:var(--gold);
    font-size:10px;
    letter-spacing:.55em;
    text-transform:uppercase;
    margin-bottom:18px;
  }

  .eyebrow::before,
  .eyebrow::after{
    content:"";
    width:18px;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity:.9;
  }

  .logo{
    font-size:clamp(40px, 12vw, 74px);
    line-height:1.08;
    letter-spacing:.14em;
    color:var(--gold2);
    text-shadow:
      0 0 14px rgba(212,175,55,.10),
      0 0 42px rgba(212,175,55,.08);
    animation: logoGlow 4.5s ease-in-out infinite alternate;
    direction:ltr;
  }

  @keyframes logoGlow{
    from{
      transform:translateY(0);
      text-shadow:
        0 0 12px rgba(212,175,55,.08),
        0 0 30px rgba(212,175,55,.05);
    }
    to{
      transform:translateY(-1px);
      text-shadow:
        0 0 22px rgba(212,175,55,.18),
        0 0 62px rgba(212,175,55,.12);
    }
  }

  .line{
    width:min(280px,72%);
    height:1px;
    margin:18px auto 22px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
    position:relative;
    overflow:hidden;
  }

  .line::after{
    content:"";
    position:absolute;
    top:0;
    left:50%;
    width:58px;
    height:1px;
    transform:translateX(-50%);
    background:linear-gradient(90deg, transparent, var(--gold2), transparent);
    box-shadow:0 0 16px rgba(212,175,55,.45);
    animation: sweep 2.8s ease-in-out infinite;
  }

  @keyframes sweep{
    0%,100%{ width:34px; opacity:.72; }
    50%{ width:96px; opacity:1; }
  }

  .title{
    font-size:clamp(24px, 6vw, 34px);
    line-height:1.65;
    margin-bottom:10px;
    color:#fbf6ed;
    font-weight:700;
  }

  .desc{
    color:var(--muted);
    font-size:14px;
    line-height:2.1;
    padding:0 10px;
    margin:0 auto 22px;
    max-width:340px;
  }

  /* =========================
     SEARCH AREA
  ========================= */

  .search-wrap{
    position:relative;
    margin-top:6px;
  }

  .search-shell{
    position:relative;
    border-radius:22px;
    padding:6px;
    background:
      linear-gradient(145deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
    border:1px solid rgba(212,175,55,.22);
    box-shadow:
      0 18px 42px rgba(0,0,0,.42),
      inset 0 1px 0 rgba(255,255,255,.05);
    backdrop-filter:blur(18px);
    overflow:hidden;
  }

  .search-shell::before{
    content:"";
    position:absolute;
    inset:-1px;
    background:
      radial-gradient(circle at 20% 0%, rgba(255,255,255,.12), transparent 24%),
      radial-gradient(circle at 80% 100%, rgba(212,175,55,.08), transparent 18%);
    pointer-events:none;
  }

  .search{
    display:flex;
    gap:8px;
    align-items:center;
    position:relative;
    z-index:2;
  }

  .search input{
    flex:1;
    min-width:0;
    background:transparent;
    border:0;
    outline:0;
    color:#fff;
    padding:15px 14px;
    font-size:16px;
    text-align:center;
    direction:rtl;
  }

  .search input::placeholder{
    color:#6f6a61;
  }

  .search button{
    border:0;
    border-radius:16px;
    padding:0 18px;
    min-height:50px;
    cursor:pointer;
    background:linear-gradient(135deg, var(--gold2), var(--gold), var(--gold3));
    color:#050505;
    font-weight:800;
    font-size:14px;
    box-shadow:
      0 12px 26px rgba(212,175,55,.18),
      inset 0 1px 0 rgba(255,255,255,.25);
    position:relative;
    overflow:hidden;
    white-space:nowrap;
  }

  .search button::after{
    content:"";
    position:absolute;
    top:0;
    left:-90%;
    width:70%;
    height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,.30), transparent);
    transform:skewX(-20deg);
    animation: shine 4.8s ease-in-out infinite;
  }

  @keyframes shine{
    0%,38%{ left:-90%; }
    68%,100%{ left:130%; }
  }

  .search button:active{
    transform:scale(.98);
  }

  /* =========================
     FOOTER MICRO TEXT
  ========================= */

  .bottom{
    z-index:2;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding-top:12px;
    border-top:1px solid rgba(212,175,55,.10);
    color:#90897e;
    font-size:9px;
    letter-spacing:.24em;
    text-transform:uppercase;
  }

  .bottom strong{
    color:var(--gold2);
    letter-spacing:.18em;
    direction:ltr;
  }

  /* =========================
     FOCUS / ACCESSIBILITY
  ========================= */

  input:focus,
  button:focus{
    outline:none;
  }

  @media (prefers-reduced-motion: reduce){
    *,
    *::before,
    *::after{
      animation:none !important;
      transition:none !important;
      scroll-behavior:auto !important;
    }
  }
</style>
</head>

<body>

  <div class="vignette"></div>
  <div class="ambient one"></div>
  <div class="ambient two"></div>

  <div class="light-column left">
    <div class="light-beam b1"></div>
    <div class="light-beam b2"></div>
    <div class="light-beam b3"></div>
  </div>

  <div class="light-column right">
    <div class="light-beam b1"></div>
    <div class="light-beam b2"></div>
    <div class="light-beam b3"></div>
  </div>

  <div class="particles" id="particles"></div>

  <div class="shell">

    <header class="top">
      <div class="brand">
        <div class="name">SINA AFZALI</div>
        <div class="tag">Signature of Scent</div>
      </div>

      <div class="tiny-mark">✦</div>
    </header>

    <main class="hero">
      <div class="hero-inner">
        <div class="eyebrow">PRIVATE FRAGRANCE HOUSE</div>

        <div class="logo">SINA AFZALI</div>

        <div class="line"></div>

        <h1 class="title">فقط کد را وارد کن، رایحه را پیدا کن.</h1>

        <p class="desc">
          تجربه‌ای لوکس، تاریک و سینمایی برای جستجوی کد عطر.
          طراحی‌شده برای حس یک برند جهانی و بسیار خاص.
        </p>

        <div class="search-wrap">
          <div class="search-shell">
            <div class="search">
              <input
                id="search"
                type="text"
                inputmode="numeric"
                autocomplete="off"
                placeholder="کد رایحه را وارد کنید..."
              />
              <button onclick="searchPerfume()">
                جستجوی کد
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="bottom">
      <span><strong>Black</strong> / Gold</span>
      <span>Mobile Experience</span>
    </footer>

  </div>

<script>
  // Animated gold particles
  const box = document.getElementById('particles');
  const count = 22;

  for (let i = 0; i < count; i++) {
    const p = document.createElement('span');
    p.className = 'particle';
    p.style.left = (Math.random() * 100) + '%';
    p.style.animationDuration = (6 + Math.random() * 7) + 's';
    p.style.animationDelay = (Math.random() * 8) + 's';
    p.style.opacity = (Math.random() * 0.6);
    box.appendChild(p);
  }

  function searchPerfume(){
    const q = document.getElementById('search').value.trim();
    if(!q){
      document.getElementById('search').focus();
      return;
    }

    // اینجا بعداً می‌تونی سرچ واقعی رو وصل کنی
    alert('جستجو برای کد: ' + q);
  }

  // Enter key support
  document.getElementById('search').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){
      searchPerfume();
    }
  });
</script>

</body>
</html>
